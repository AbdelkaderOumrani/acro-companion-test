<button type="button" class="slot" [class.active]="isActive()" (click)="onSelect()">
  <span class="slot-index">{{ slotIndex() + 1 }}</span>
  @if (element(); as slotElement) {
  <span class="slot-symbol" [attr.title]="slotElement.label">{{ slotElement.label }}</span>
  <span class="slot-val">{{ slotElement.value | number: '1.1-1' }}</span>
  } @else {
  <span class="slot-symbol empty"></span>
  <span class="slot-val">&nbsp;</span>
  }
</button>
